name: weekly-board
on:
  schedule:
    - cron: "0 11 * * 2"      # Tuesday 07:00 ET — grade last week, score next week
    - cron: "0 12 * * 4,6,0"  # Thu/Sat/Sun — rescore with the latest injury report + lines
    # Odds-only refreshes AFTER inactives post (90 min before kickoff). Books pull scratched players' markets, so
    # these fetches are the activity check the Longshot tier keys on. GitHub delays scheduled runs by minutes to
    # hours (week 7: the 12:10 ET job started at 3:00 pm), so several crons cover each window and the job itself
    # exits unless the clock is inside the window. Each run that fetches costs ~16 Odds API credits.
    - cron: "50 15 * * 0"     # Sun 11:50 ET  } Sunday 1 pm games: window 11:45-12:50 ET
    - cron: "5 16 * * 0"      # Sun 12:05 ET  }
    - cron: "20 16 * * 0"     # Sun 12:20 ET  }
    - cron: "35 16 * * 0"     # Sun 12:35 ET  }
    - cron: "20 19 * * 0"     # Sun 3:20 ET   } Sunday 4:05/4:25 games: window 3:10-4:10 ET
    - cron: "40 19 * * 0"     # Sun 3:40 ET   }
    - cron: "5 23 * * 0"      # Sun 7:05 ET   } Sunday night: window 6:55-8:05 ET
    - cron: "30 23 * * 0"     # Sun 7:30 ET   }
    - cron: "5 23 * * 1,4"    # Mon/Thu 7:05 ET } MNF / TNF: window 6:55-8:05 ET
    - cron: "30 23 * * 1,4"   # Mon/Thu 7:30 ET }
  workflow_dispatch:
    inputs: { week: { description: "NFL week", required: true } }
jobs:
  gameday-odds:
    if: github.event_name == 'schedule' && !contains(fromJSON('["0 11 * * 2","0 12 * * 4,6,0"]'), github.event.schedule)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Refresh odds after inactives (only inside a post-inactives window)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python3 - <<'PY'
          import datetime as d, os, subprocess, sys, zoneinfo
          now = d.datetime.now(zoneinfo.ZoneInfo("America/New_York")); hm = now.hour * 60 + now.minute; dow = now.weekday()  # Mon=0
          windows = {6: [(11*60+45, 12*60+50), (15*60+10, 16*60+10), (18*60+55, 20*60+5)], 0: [(18*60+55, 20*60+5)], 3: [(18*60+55, 20*60+5)]}
          inside = any(a <= hm <= b for a, b in windows.get(dow, []))
          print(f"now {now:%a %H:%M} ET -> {'inside' if inside else 'outside'} a post-inactives window")
          if not inside: sys.exit(0)
          week = max(1, (now.date() - d.date(2026, 9, 8)).days // 7 + 1)
          if os.environ.get("ODDS_API_KEY"): sys.exit(subprocess.call([sys.executable, "-m", "engine.odds_api", "--week", str(week)]))
          PY
  run:
    if: github.event_name == 'workflow_dispatch' || contains(fromJSON('["0 11 * * 2","0 12 * * 4,6,0"]'), github.event.schedule)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      week: ${{ steps.score.outputs.week }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Restore model + data cache
        uses: actions/cache@v4
        with:
          path: |
            data/*.parquet
            data/td_model.pkl
          key: sixpts-data-${{ github.run_id }}
          restore-keys: sixpts-data-
      - name: Score the week
        id: score
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PF_COOKIE: ${{ secrets.PF_COOKIE }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          WEEK="${{ github.event.inputs.week }}"
          if [ -z "$WEEK" ]; then WEEK=$(python -c "import datetime as d;print(max(1,(d.date.today()-d.date(2026,9,8)).days//7+1))"); fi
          if [ ! -f data/td_model.pkl ]; then python3 engine/build_training.py && python3 engine/fit_model.py; fi
          if [ "$(date +%u)" = "2" ]; then python3 -m engine.score_card --season 2026 --week $((WEEK-1)) || true; python3 -m engine.grade --season 2026 --week $((WEEK-1)) || true; fi
          python3 engine/build_training.py --upcoming 2026 $WEEK
          python3 -m engine.score_week --season 2026 --week $WEEK
          python3 -m engine.team_profiles --season 2026 --week $WEEK
          python3 -m engine.sim_week --season 2026 --week $WEEK || true
          echo "WEEK=$WEEK" >> $GITHUB_ENV; echo "week=$WEEK" >> $GITHUB_OUTPUT
          if [ -n "$ODDS_API_KEY" ]; then python3 -m engine.odds_api --week $WEEK || true; fi
          if [ -n "$PF_COOKIE" ]; then python3 -m engine.pf_odds --week $WEEK --live || true; fi
      - name: Commit public boards so the deployed API serves them
        run: |
          git config user.name "sixpts-bot"; git config user.email "bot@sixpts.com"
          git add -f data/board_w*_public.json data/teams_w*.json data/scorecard_w*.json data/sim_w*.json || true
          git diff --cached --quiet || (git commit -m "boards: week ${WEEK} [skip ci]" && git push)
      - name: Upload boards
        uses: actions/upload-artifact@v4
        with:
          name: boards-week-${{ github.run_id }}
          path: |
            data/board_*.json
            data/teams_*.json

  # One replay video per game (the simulated game nearest the median score), 9x16 for social. Rendered after the
  # Tuesday board so the sim JSON is on main; published as release assets so the videos never bloat the repo.
  replays:
    needs: run
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 11 * * 2'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt skia-python && ffmpeg -version | head -1
      - name: Render
        env: { WEEK: "${{ needs.run.outputs.week }}" }
        run: |
          test -f data/sim_w${WEEK}.json || { echo "no sim for week $WEEK"; exit 0; }
          python3 -m engine.replay --week $WEEK --format 9x16 --crf 23
          ls -la data/replays/w${WEEK}
      - name: Publish as release assets
        env: { WEEK: "${{ needs.run.outputs.week }}", GH_TOKEN: "${{ github.token }}" }
        run: |
          test -d data/replays/w${WEEK} || exit 0
          TAG=replays-w${WEEK}
          gh release view $TAG >/dev/null 2>&1 || gh release create $TAG --title "Week ${WEEK} sim replays" --notes "One video per game: the simulated game nearest the median score, play by play. Simulated, not predicted."
          gh release upload $TAG data/replays/w${WEEK}/*.mp4 --clobber
          python3 - <<'PY'
          import json, os, pathlib
          w = os.environ["WEEK"]; repo = os.environ.get("GITHUB_REPOSITORY", "jamesjholee/sixpts")
          files = sorted(p.name for p in pathlib.Path(f"data/replays/w{w}").glob("*.mp4"))
          m = {}
          for f in files:
              gid, fmt = f.rsplit("_", 1); m.setdefault(gid, {})[fmt[:-4]] = f"https://github.com/{repo}/releases/download/replays-w{w}/{f}"
          json.dump({"week": int(w), "games": m}, open(f"data/replays_w{w}.json", "w"), indent=1)
          PY
          git config user.name "sixpts-bot"; git config user.email "bot@sixpts.com"
          git add -f data/replays_w${WEEK}.json
          git diff --cached --quiet || (git commit -m "replays: week ${WEEK} [skip ci]" && git pull --rebase && git push)
